config-version = "2.7"
bind = "0.0.0.0:25577"
motd = "<gold><bold>Savage</bold></gold> <gray>DEV</gray> <dark_gray>|</dark_gray> <green>1.21.1</green>"
show-max-players = 100
online-mode = false
force-key-authentication = false

# Velocity 3.3: modern forwarding + arquivo de secret (obrigatorio)
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

[servers]
auth = "127.0.0.1:25566"
lobby = "127.0.0.1:25567"
game = "127.0.0.1:25568"
eventos = "127.0.0.1:25570"

try = ["lobby"]

# Substitui o default do Velocity (factions/minigames.example.com) que impede subir o proxy
[forced-hosts]

[advanced]
compression-threshold = 256
bungee-plugin-message-channel = true
log-player-connections = true

[query]
enabled = false
