  game.rank.zw:
    description: Rank exclusivo ZW (acesso total)
    default: false
    children:
      game.*: true
      lobbyhost.*: true
      proxyhost.*: true
      auth.*: true
      eventos.*: true
      tag.*: true
      medal.*: true

  tag.*:
    default: false
  tag.builder:
