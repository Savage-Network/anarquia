      medal.solar: true
      medal.supernova: true
      medal.aurora: true
      medal.fortuna: true
      medal.corona: true
  game.rank.beta:
    default: false
    children:
      medal.cometa: true
      medal.orbita: true
      medal.pulso: true
      medal.raio: true
  game.rank.precious:
    default: false
    children:
      medal.precious: true
  game.rank.builder:
    default: false
    children:
      medal.ajudante: true
      medal.espadas: true
  game.rank.helper:
    default: false
    children:
      medal.ajudante: true
  game.rank.mod:
    default: false
    children:
      game.staffchat: true
      lobbyhost.staffchat: true
      proxyhost.staffchat: true
      game.staff: true
      medal.comando: true
      medal.cruz_sagrada: true
      medal.impacto: true
  game.rank.modplus:
    default: false
    children:
      game.staffchat: true
      lobbyhost.staffchat: true
      proxyhost.staffchat: true
      game.staff: true
      medal.comando: true
      medal.cruz_sagrada: true
      medal.impacto: true
  game.rank.admin:
    default: false
    children:
      medal.maestro: true
      medal.mestre: true
      medal.star: true
  game.rank.vermelho:
    default: false
