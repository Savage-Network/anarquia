# Referência — loja PRESENCIAL no spawn (placas)
# Copie para plugins/game/physical-shop.yml após deploy
#
# ═══════════════════════════════════════════════════════════════
# COMO MONTAR (staff — permissão game.shop.admin)
# ═══════════════════════════════════════════════════════════════
# 1. Coloque um BAÚ ou BARRIL no chão
# 2. Coloque uma PLACA em cima ou na lateral do baú
# 3. Escreva EXATAMENTE (4 linhas):
#
#    Linha 1: [LojaServer]     ← loja do servidor (estoque infinito)
#    Linha 2: Comprar          ← jogador compra do servidor
#    Linha 3: NOME_MATERIAL    ← ex: DIAMOND (nome Bukkit, MAIÚSCULO)
#    Linha 4: PRECO            ← preço POR UNIDADE (número)
#
# 4. Salve a placa — ela registra automaticamente
# 5. Clique direito = 1 un | Shift + clique = 64 un
#
# Venda ao servidor (jogador vende itens):
#    Linha 1: [LojaServer]
#    Linha 2: Vender
#    Linha 3: MATERIAL
#    Linha 4: preço por unidade (use sell-prices.yml)
#
# Loja de jogador (fora do spawn): troque [LojaServer] por [Loja]
#   e encha o baú com estoque. Permissão: game.shop.create
# ═══════════════════════════════════════════════════════════════

sign-format:
  header: "[LojaServer]"
  buy: "Comprar"
  sell: "Vender"

