name: lobbyhost
version: '${version}'
main: com.minecraft.lobbyhost.LobbyHostPlugin
api-version: '1.21'
authors: [SavageLabs]
description: Servidor hub + lobbies de modo (Paper 1.21)
softdepend: [PlaceholderAPI, LuckPerms, ProtocolLib]
load: STARTUP

commands:
  fly:
    description: Alterna modo voo (VIP/staff)
    usage: /fly
    aliases: [voar]
  mission:
    description: Abre o menu de missoes diarias
    usage: /mission
    aliases: [missao, missoes]
  lobbyprocess:
    description: Comandos administrativos do lobby
    usage: /lobbyprocess <subcomando>
    permission: lobbyhost.admin
    aliases: [lobbyadmin]
  setdiscord:
    description: Define a posicao do holograma do Discord
    usage: /setdiscord
    permission: lobbyhost.admin
  discordhologram:
    description: Recarrega o holograma do Discord
    usage: /discordhologram
    permission: lobbyhost.admin
  cleandiscord:
    description: Remove o holograma do Discord
    usage: /cleandiscord
    permission: lobbyhost.admin
  play:
    description: Abre o menu de selecao de modos
    usage: /play
  account:
    description: Mostra informacoes da sua conta
    usage: /account [jogador]
    aliases: [perfil, conta]
  tag:
    description: Lista/escolhe a sua tag
    usage: /tag [nome]
    aliases: [tags]
  medal:
    description: Lista/escolhe a sua medalha
    usage: /medal [nome]
    aliases: [medalha, medalhas]
  prefixtype:
    description: Modo de exibicao das tags
    usage: /prefixtype [modo]
    aliases: [prefixo, modotag]
  customtitle:
    description: Define titulo flutuante acima do nick
    usage: /customtitle <texto|remover>
    permission: lobbyhost.admin
    aliases: [titulo]
  prefs:
    description: Preferencias da conta
    usage: /prefs [list|toggle <chave>]
    aliases: [preferencias]
  clan:
    description: Sistema de clãs com painel GUI
    usage: /clan [subcomando]
    aliases: [cla]
  clantag:
    description: Altera a cor da clantag do seu clã
    usage: /clantag <cor>
    aliases: [clancor]
  cc:
    description: Chat privado do clã
    usage: /cc <mensagem>
    aliases: [c]
  lobbyreload:
    description: Recarrega configuracoes do plugin
    usage: /lobbyreload
    permission: lobbyhost.admin
  npc:
    description: Gerencia NPCs do hub (Display 1.21)
    usage: /npc <reload|list|spawn|remove>
    permission: lobbyhost.admin

permissions:
  lobbyhost.*:
    description: Acesso total
    default: op
    children:
      lobbyhost.admin: true
      lobbyhost.staff: true
      lobbyhost.vip: true
  lobbyhost.admin:
    default: op
  lobbyhost.staff:
    default: false
  lobbyhost.vip:
    default: false
  lobbyhost.fly:
    default: false
